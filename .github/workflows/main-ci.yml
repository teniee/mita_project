name: Main CI/CD Pipeline

on:
  push:
    # claude/** feature branches run the full pipeline so readiness work
    # gets real CI evidence before any merge to main.
    branches: [ main, 'claude/**', 'feat/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]

# Prevent multiple runs for same commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend Python CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    # Real service containers — the backend test suite exercises real
    # PostgreSQL and Redis integrations (repositories, onboarding persistence,
    # rate limiting, token blacklist, async flows) rather than mocking them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_mita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest defaults point here; set explicitly so intent is clear.
      DATABASE_URL: postgresql://test:test@localhost:5432/test_mita?sslmode=disable
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci_test_secret_key_minimum_32_chars_long_xx
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long_xx
      ENVIRONMENT: test
      TESTING: "true"
      FIREBASE_JSON: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code quality checks
        run: |
          # Format check
          black --check .

          # Import sorting
          isort --check .

          # Linting
          ruff check .

      - name: Apply database migrations (clean DB → head)
        run: |
          export PYTHONPATH=.
          python -m alembic upgrade head

      - name: Run tests
        run: |
          export PYTHONPATH=.
          pytest --maxfail=5 --disable-warnings -q

      - name: Security scan (Bandit)
        run: bandit -r app/ -ll

  # Mobile Flutter CI — hermetic: the live-API integration tests (auth,
  # onboarding, transactions, calendar journey) run against THIS commit's
  # backend on localhost, never against production. Without an explicit
  # API_BASE_URL the tests fall back to the production URL, which IS
  # reachable from GitHub runners — that both pollutes production data
  # and tests the wrong (deployed) code.
  mobile-ci:
    name: Mobile CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_mita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_mita?sslmode=disable
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci_test_secret_key_minimum_32_chars_long_xx
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long_xx
      ENVIRONMENT: development
      FIREBASE_JSON: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the suite is verified against; a floating
          # 'stable' channel made widget tests behave differently in CI
          # than locally (e.g. SnackBar timer semantics).
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Set up Java (Android toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python (backend for E2E)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Start backend (clean DB → migrations → uvicorn)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          export PYTHONPATH=.
          python -m alembic upgrade head
          nohup python -m uvicorn app.main:app --port 8000 --log-level warning > /tmp/uvicorn-ci.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health || (cat /tmp/uvicorn-ci.log; exit 1)

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code
        run: |
          # Format check
          dart format --set-exit-if-changed .

          # Analyze
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # Full suite including the live-API integration tests, pointed at
      # the freshly built backend above — real E2E on every push.
      - name: Run tests
        run: flutter test --dart-define=API_BASE_URL=http://localhost:8000

      - name: Backend log on failure
        if: failure()
        working-directory: .
        run: tail -100 /tmp/uvicorn-ci.log || true

      - name: Android debug build
        run: flutter build apk --debug --dart-define=ENV=development

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mita-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ChatGPT app (MCP service). Own environment: mcp 2.x needs pydantic>=2.12
  # while the API pins 2.9.2, so migrations run from the API's dependency set
  # and the MCP suite from requirements-mcp-dev.txt.
  mcp-ci:
    name: MCP CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_mita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_mita?sslmode=disable
      SECRET_KEY: ci_test_secret_key_minimum_32_chars_long_xx
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long_xx
      ENVIRONMENT: test
      FIREBASE_JSON: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply database migrations (API dependency set)
        run: |
          python -m venv /tmp/api-venv
          /tmp/api-venv/bin/pip install -q -r requirements.txt
          PYTHONPATH=. /tmp/api-venv/bin/python -m alembic upgrade head

      - name: Install MCP dependencies
        run: |
          python -m venv /tmp/mcp-venv
          /tmp/mcp-venv/bin/pip install -q --upgrade pip
          /tmp/mcp-venv/bin/pip install -q -r requirements-mcp-dev.txt pip-audit jsonschema

      - name: Lint (MCP sources)
        run: |
          /tmp/mcp-venv/bin/black --check app/mcp tests_mcp scripts/mcp
          /tmp/mcp-venv/bin/isort --check app/mcp tests_mcp scripts/mcp
          /tmp/mcp-venv/bin/ruff check app/mcp tests_mcp scripts/mcp

      - name: Security scan (Bandit, MCP)
        run: /tmp/mcp-venv/bin/bandit -r app/mcp -ll

      - name: Dependency audit (MCP requirements and full lock)
        run: |
          /tmp/mcp-venv/bin/pip-audit -r requirements-mcp.txt --progress-spinner off
          /tmp/mcp-venv/bin/pip-audit -r requirements-mcp.lock --progress-spinner off

      - name: Plugin package validation
        run: /tmp/mcp-venv/bin/python scripts/mcp/build_plugin.py --check

      # Security gate: fails if a write/destructive tool appears, a tool takes
      # a user identity, annotations go missing, cross-user isolation breaks,
      # redirect validation loosens, PKCE can be bypassed, scopes escalate, or
      # revocation (token_version / password change / deletion) stops working.
      - name: MCP security gate
        run: |
          PYTHONPATH=. /tmp/mcp-venv/bin/pytest -c tests_mcp/pytest.ini -q \
            tests_mcp/test_tool_contract.py tests_mcp/test_isolation.py \
            tests_mcp/test_auth.py tests_mcp/test_oauth_flow.py \
            tests_mcp/test_oauth_adversarial.py tests_mcp/test_oauth_concurrency.py

      - name: MCP tests (full suite)
        run: PYTHONPATH=. /tmp/mcp-venv/bin/pytest -c tests_mcp/pytest.ini tests_mcp -q

      - name: Build MCP image
        run: docker build -f deploy/mcp/Dockerfile -t mita-mcp:ci .

      - name: Container end-to-end (OAuth over HTTP, all tools, restart, log scan)
        run: |
          KEY="$(/tmp/mcp-venv/bin/python -c 'from app.mcp.auth.keys import generate_private_key_pem as g; print(g(2048))')"
          CSRF="$(openssl rand -hex 32)"
          GRANT="$(openssl rand -hex 32)"
          start_mcp() {
            docker run -d --name mita-mcp --network host \
              -e ENVIRONMENT=test -e PORT=8080 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e SECRET_KEY="$SECRET_KEY" -e JWT_SECRET="$JWT_SECRET" \
              -e MCP_PUBLIC_URL=http://localhost:8080 \
              -e MCP_OAUTH_PRIVATE_KEY="$KEY" -e MCP_LOGIN_CSRF_SECRET="$CSRF" \
              -e MCP_GRANT_FINGERPRINT_SECRET="$GRANT" \
              -e OPENAI_APPS_CHALLENGE_TOKEN=ci-challenge \
              mita-mcp:ci
            for i in $(seq 1 30); do curl -sf http://localhost:8080/health && return 0; sleep 1; done
            docker logs mita-mcp; return 1
          }
          start_mcp
          test "$(curl -s http://localhost:8080/.well-known/openai-apps-challenge)" = "ci-challenge"
          PYTHONPATH=. /tmp/mcp-venv/bin/python scripts/mcp/e2e_http.py \
            --base-url http://localhost:8080 --database-url "$DATABASE_URL" \
            --state /tmp/e2e.json --phase first
          docker restart mita-mcp
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          PYTHONPATH=. /tmp/mcp-venv/bin/python scripts/mcp/e2e_http.py \
            --base-url http://localhost:8080 --database-url "$DATABASE_URL" \
            --state /tmp/e2e.json --phase after-restart --log-file /dev/null
          docker logs mita-mcp > /tmp/mcp-container.log 2>&1
          PYTHONPATH=. /tmp/mcp-venv/bin/python - <<'PY'
          import json, pathlib
          secrets = json.loads(pathlib.Path("/tmp/e2e.json").read_text())["secrets"]
          logs = pathlib.Path("/tmp/mcp-container.log").read_text(errors="replace")
          leaked = [i for i, s in enumerate(secrets) if s and s in logs]
          assert not leaked, f"container logs contain secrets: items {leaked}"
          assert "42.17" not in logs, "container logs contain an amount"
          print("container logs: no codes, tokens, passwords, e-mails or amounts")
          PY

      - name: Container log on failure
        if: failure()
        run: docker logs mita-mcp || true

  # Build check
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, mobile-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mita-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-ci, mobile-ci, mcp-ci]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.backend-ci.result }}" == "success" ]] && [[ "${{ needs.mobile-ci.result }}" == "success" ]] && [[ "${{ needs.mcp-ci.result }}" == "success" ]]; then
            echo "✅ All CI checks passed"
            exit 0
          else
            echo "❌ Some CI checks failed"
            echo "Backend: ${{ needs.backend-ci.result }}"
            echo "Mobile: ${{ needs.mobile-ci.result }}"
            echo "MCP: ${{ needs.mcp-ci.result }}"
            exit 1
          fi
